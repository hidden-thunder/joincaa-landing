version: "3.8"

services:
  joincaa:

    image: nginx:alpine

    container_name: joincaa-landing

    restart: unless-stopped

    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.joincaa.rule=Host(`joincaa.team`) || Host(`www.joincaa.team`)"
      - "traefik.http.routers.joincaa.entrypoints=web,websecure"
      - "traefik.http.routers.joincaa.tls=true"
      - "traefik.http.routers.joincaa.tls.certresolver=mytlschallenge"

      - "traefik.http.services.joincaa.loadbalancer.server.port=80"

    networks:
      - root_default

networks:
  root_default:
    external: true