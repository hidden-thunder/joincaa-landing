<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>joincaa.team: propuestas</title>
<style>
  :root{
    --bg:#15171b; --panel:#1d2026; --line:#2c3038; --ink:#eceae4; --mute:#a3a7ae; --accent:#d6a94f;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  ::selection{background:var(--accent);color:#15171b}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;font-weight:600;margin:0;margin-right:auto;letter-spacing:.01em}
  h1 span{color:var(--mute);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--mute);font:inherit;padding:7px 14px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
  button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{flex:1;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:20px;padding:20px;min-height:0}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:32px}
  .tag{font-weight:700;color:var(--accent)}
  .name{font-weight:600}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:600;padding:5px 8px}
  .pane-head a{margin-left:auto;color:var(--mute);font-size:13px;text-underline-offset:3px;white-space:nowrap}
  .pane-head a:hover{color:var(--ink)}
  .stage{flex:1;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
  .frame{position:absolute;top:0;left:50%;transform-origin:top left;border:0;background:#fff;border-radius:6px}
  body.mobile .frame{top:12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  footer{padding:0 20px 14px;color:var(--mute);font-size:13px}
  .empty{padding:40px;color:var(--mute)}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:70vh}}
</style>
</head>
<body>
<header>
  <h1>joincaa.team <span>· propuestas de rediseño</span></h1>
  <div class="seg" role="group" aria-label="Tamaño de pantalla">
    <button type="button" data-mode="desktop" aria-pressed="true">Escritorio</button>
    <button type="button" data-mode="mobile" aria-pressed="false">Móvil</button>
  </div>
</header>
<main id="panes"></main>
<footer>Ambiente de pruebas. Las solicitudes enviadas desde aquí llegan al Case Desk de pruebas, no al equipo de reclutamiento. Cada vista se puede desplazar.</footer>
<script>
  const SIZES = { desktop:[1440, 900], mobile:[390, 844] };
  const LETTERS = 'ABCDEFGH';
  let mode = 'desktop';
  const main = document.getElementById('panes');

  function fit(){
    const [w,h] = SIZES[mode];
    document.querySelectorAll('.stage').forEach(stage => {
      const f = stage.querySelector('.frame');
      const pad = mode === 'mobile' ? 24 : 0;
      const sw = stage.clientWidth, sh = stage.clientHeight - pad;
      const s = mode === 'mobile' ? Math.min(1, sh / h, sw / w) : Math.min(1, sw / w);
      f.style.width = w + 'px';
      f.style.height = (mode === 'mobile' ? h : sh / s) + 'px';
      f.style.transform = `translateX(${-w * s / 2}px) scale(${s})`;
    });
  }

  function pane(versions, index){
    const sec = document.createElement('section');
    sec.className = 'pane';
    const head = document.createElement('div');
    head.className = 'pane-head';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = LETTERS[index];
    head.append(tag);
    let label;
    if (versions.length > 2) {
      label = document.createElement('select');
      label.setAttribute('aria-label', `Versión del panel ${LETTERS[index]}`);
      versions.forEach((v, i) => label.add(new Option(v.nombre, i, false, i === index)));
    } else {
      label = document.createElement('span');
      label.className = 'name';
    }
    const link = document.createElement('a');
    link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Abrir en pestaña nueva';
    head.append(label, link);
    const stage = document.createElement('div');
    stage.className = 'stage';
    const frame = document.createElement('iframe');
    frame.className = 'frame';
    stage.append(frame);
    sec.append(head, stage);

    const show = i => {
      const v = versions[i];
      if (label.tagName === 'SPAN') label.textContent = v.nombre;
      link.href = `${v.slug}/`;
      frame.src = `${v.slug}/`;
      frame.title = `Propuesta ${LETTERS[index]}: ${v.nombre}`;
    };
    if (label.tagName === 'SELECT') label.addEventListener('change', () => show(+label.value));
    show(index);
    return sec;
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.body.classList.toggle('mobile', mode === 'mobile');
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    fit();
  }));
  addEventListener('resize', fit);

  fetch('versiones.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(versions => {
      if (!versions.length) throw new Error('vacío');
      const n = Math.min(2, versions.length);
      main.style.setProperty('--cols', n);
      for (let i = 0; i < n; i++) main.append(pane(versions, i));
      fit();
    })
    .catch(() => { main.innerHTML = '<p class="empty">No hay versiones publicadas.</p>'; });
</script>
</body>
</html>
